name: NBA I1-I4 verification

on:
  push:
    branches: [main, agent/nba-i1-i4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-real-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Validate generated artifacts and source
        run: |
          python scripts/generate_model_artifacts.py --check
          python -m ruff check src tests scripts/generate_model_artifacts.py scripts/update_powerbi_project_i4.py scripts/validate_i1_i4.py
          python scripts/validate_s1_s4.py
          python scripts/validate_i1_i4.py
      - name: Test core ETL
        run: python -m pytest --cov=nba_pipeline --cov-report=term-missing
      - name: Process the six real CSV files
        run: |
          python scripts/normalize_csv_line_endings.py
          python -m nba_pipeline transform --input-dir CODE/data_raw --run-dir ci-run --evidence-dir ci-evidence/etl
          python -m nba_pipeline validate-model --run-dir ci-run
      - uses: actions/upload-artifact@v4
        with:
          name: nba-real-etl-evidence
          path: ci-evidence/etl
          if-no-files-found: error

  sql-server-integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CI_Strong_Only_2026!"
        ports:
          - 1433:1433
    env:
      NBA_SQL_DRIVER: ODBC Driver 18 for SQL Server
      NBA_SQL_SERVER: localhost,1433
      NBA_SQL_DATABASE: NBA_CI
      NBA_SQL_TRUSTED_CONNECTION: "no"
      NBA_SQL_USER: sa
      NBA_SQL_PASSWORD: "CI_Strong_Only_2026!"
      NBA_SQL_ENCRYPT: "no"
      NBA_SQL_TRUST_SERVER_CERTIFICATE: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |
          . /etc/os-release
          curl -fsSLo /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if python - <<'PY'
          import os
          import pyodbc
          connection = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};"
              "SERVER=localhost,1433;DATABASE=master;UID=sa;"
              f"PWD={os.environ['NBA_SQL_PASSWORD']};Encrypt=no;TrustServerCertificate=yes;",
              timeout=3,
          )
          connection.close()
          PY
            then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Load and reconcile the real model
        run: |
          python scripts/normalize_csv_line_endings.py
          python -m nba_pipeline transform --input-dir CODE/data_raw --run-dir ci-run
          python -m nba_pipeline load-sql --run-dir ci-run --evidence-dir ci-evidence/sql
          python -m nba_pipeline validate-model --run-dir ci-run
      - uses: actions/upload-artifact@v4
        with:
          name: nba-sql-reconciliation
          path: ci-evidence/sql
          if-no-files-found: error
